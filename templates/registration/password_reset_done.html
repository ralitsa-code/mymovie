
{% extends 'base.html' %}

{% block content %}
<section class="auth-section">
    <div class="auth-container auth-success">

        <div class="auth-success-icon">
            <i class="fa-solid fa-envelope-circle-check"></i>
        </div>

        <span class="section-label">ACCOUNT RECOVERY</span>

        <h1>Check Your Email</h1>

        <p>
            If an account exists with the email address you provided,
            you will receive instructions to reset your password.
        </p>

        <a href="{% url 'login' %}" class="button button-primary">
            Back to Login
        </a>

    </div>
</section>
{% endblock %}
